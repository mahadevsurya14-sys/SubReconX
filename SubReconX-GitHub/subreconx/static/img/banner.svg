<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1525;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.3" />
    </linearGradient>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2744" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="320" fill="url(#grid)" rx="12"/>

  <!-- Top & bottom accent lines -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.7" rx="1"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#accent)" opacity="0.4" rx="1"/>

  <!-- Decorative scanning lines -->
  <line x1="60" y1="80" x2="60" y2="240" stroke="#00ff88" stroke-width="1" opacity="0.15"/>
  <line x1="1140" y1="80" x2="1140" y2="240" stroke="#00ff88" stroke-width="1" opacity="0.15"/>

  <!-- Left side: Radar / scope icon -->
  <g transform="translate(155, 155)" opacity="0.9">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.3"/>
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.25"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#00ff88" opacity="0.8"/>
    <!-- Crosshairs -->
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
    <!-- Sweep line -->
    <line x1="0" y1="0" x2="42" y2="-38" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
    <!-- Detected nodes -->
    <circle cx="25" cy="-18" r="3" fill="#00ff88" opacity="0.7"/>
    <circle cx="-15" cy="30" r="2.5" fill="#00ff88" opacity="0.5"/>
    <circle cx="38" cy="15" r="2" fill="#00ff88" opacity="0.6"/>
    <circle cx="-35" cy="-20" r="2.5" fill="#00ff88" opacity="0.4"/>
    <circle cx="10" cy="42" r="2" fill="#00ff88" opacity="0.3"/>
  </g>

  <!-- Main title -->
  <text x="310" y="138" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" filter="url(#textglow)" letter-spacing="2">
    Sub<tspan fill="#00ff88">Recon</tspan>X
  </text>

  <!-- Subtitle -->
  <text x="315" y="178" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif" font-size="18" fill="#8899aa" letter-spacing="5" font-weight="300">
    SUBDOMAIN DISCOVERY &amp; ATTACK SURFACE MAPPING
  </text>

  <!-- Feature tags -->
  <g transform="translate(315, 210)">
    <!-- Tag: Passive Enumeration -->
    <rect x="0" y="0" width="160" height="28" rx="4" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#00ff88" opacity="0.9" filter="url(#subtleglow)">⟐ Passive Enumeration</text>

    <!-- Tag: DNS Verification -->
    <rect x="175" y="0" width="145" height="28" rx="4" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="247" y="18" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#00ff88" opacity="0.9" filter="url(#subtleglow)">⟐ DNS Verification</text>

    <!-- Tag: HTTP Probing -->
    <rect x="335" y="0" width="130" height="28" rx="4" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="400" y="18" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#00ff88" opacity="0.9" filter="url(#subtleglow)">⟐ HTTP Probing</text>

    <!-- Tag: Reports -->
    <rect x="480" y="0" width="140" height="28" rx="4" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="550" y="18" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#00ff88" opacity="0.9" filter="url(#subtleglow)">⟐ Pro Reporting</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(315, 260)">
    <rect x="0" y="0" width="58" height="22" rx="3" fill="#00ff88" fill-opacity="0.15"/>
    <text x="29" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff88" font-weight="600">v0.1.0</text>
  </g>

  <!-- Python badge -->
  <g transform="translate(385, 260)">
    <rect x="0" y="0" width="80" height="22" rx="3" fill="#3572A5" fill-opacity="0.25" stroke="#3572A5" stroke-width="0.6" stroke-opacity="0.4"/>
    <text x="40" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#7eadd4">Python 3</text>
  </g>

  <!-- FastAPI badge -->
  <g transform="translate(477, 260)">
    <rect x="0" y="0" width="72" height="22" rx="3" fill="#009688" fill-opacity="0.2" stroke="#009688" stroke-width="0.6" stroke-opacity="0.4"/>
    <text x="36" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#4db6ac">FastAPI</text>
  </g>

  <!-- Right side decorative data stream -->
  <g transform="translate(1050, 90)" opacity="0.25">
    <text font-family="monospace" font-size="9" fill="#00ff88">
      <tspan x="0" dy="0">api.target.com</tspan>
      <tspan x="0" dy="14">mail.target.com</tspan>
      <tspan x="0" dy="14">cdn.target.com</tspan>
      <tspan x="0" dy="14">dev.target.com</tspan>
      <tspan x="0" dy="14">staging.target.com</tspan>
      <tspan x="0" dy="14">vpn.target.com</tspan>
      <tspan x="0" dy="14">admin.target.com</tspan>
      <tspan x="0" dy="14">portal.target.com</tspan>
      <tspan x="0" dy="14">docs.target.com</tspan>
      <tspan x="0" dy="14">status.target.com</tspan>
      <tspan x="0" dy="14">beta.target.com</tspan>
    </text>
  </g>
</svg>
